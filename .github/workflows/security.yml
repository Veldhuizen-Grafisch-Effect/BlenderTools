# Security scans for this repo: secrets in the git history (gitleaks) and known
# vulnerabilities in the Python dependencies (pip-audit). Added 12-11-2026: the repo is
# public and had no scan at all, so a key committed by accident would have gone unnoticed.
#
# gitleaks is a binary pinned by checksum (gitleaks-action needs a paid licence for an
# organisation); --redact keeps a found value out of the log. Versions are raised by hand:
# change the version and the sha256 from the release's checksums file together.
name: security

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Sunday 05:00 UTC: new vulnerabilities appear without a commit here.
    - cron: "0 5 * * 0"
  workflow_dispatch:

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: a secret stays readable in an old commit of a public repo.
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch gitleaks (checksum checked)
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "$url"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c - >/dev/null || { echo "::error::gitleaks: checksum does not match"; exit 1; }
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 .'

  dependencies:
    name: dependencies (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # requirements.txt has lower bounds only, so this audits the newest versions. A finding
      # blocks the weekly and the manual run; on a push or PR it is a warning, because the
      # commit being checked did not cause it.
      - name: Audit requirements.txt
        run: |
          if pipx run "pip-audit==${PIP_AUDIT_VERSION}" -r requirements.txt; then exit 0; fi
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch) exit 1 ;;
            *) echo "::warning::pip-audit found vulnerable dependencies (see the log above)." ;;
          esac
